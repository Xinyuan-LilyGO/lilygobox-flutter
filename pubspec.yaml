name: lilygobox
description: none
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# release 版本所需的包
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_symbols_icons: ^4.2960.0
  window_manager: ^0.7.0
  provider: ^6.1.5+1
  intl: ^0.20.3
  package_info_plus: ^9.0.1
  flutter_svg: ^2.4.0
  vector_graphics: ^1.3.1
  http: ^1.6.0
  crypto: ^3.0.8
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  file_selector: ^1.1.0
  super_clipboard: ^0.9.1
  super_sliver_list: ^0.4.1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  characters: ^1.4.1
  lilygobox_codecs:
    path: packages/lilygobox_codecs
  sqlite3: ^3.9.1
  path_provider: ^2.1.6
  koni_sevenz: ^0.9.0
  koni_archive_core: ^0.9.0
  material_ui: 1.11.0

# debug 版本所需的包
dev_dependencies:
  ffi: ^2.2.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/branding/lilygobox_logo.svg
    - assets/fonts/Inter/OFL.txt
    - assets/fonts/Roboto/OFL.txt
    - assets/fonts/GoogleSansFlex/OFL.txt
  fonts:
    - family: LilygoBoxGoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex/GoogleSansFlex-Regular.ttf
    - family: LilygoBoxInter
      fonts:
        - asset: assets/fonts/Inter/Inter-Variable.ttf
    - family: LilygoBoxRoboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Variable.ttf
