name: lilygobox
description: none
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2
  flutter: ^3.35.6

# release 版本所需的包
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_symbols_icons: ^4.2874.0
  window_manager: ^0.5.1
  provider: ^6.1.5+1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  flutter_svg: ^2.2.3
  vector_graphics: ^1.1.19
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

# debug 版本所需的包
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/branding/lilygobox_logo.svg
